[project]
name = "multi-platform-image-processor"
version = "0.2.0"
description = "全自动多平台商品图片包处理 skill"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.55.0",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pngquant-cli>=3.0.3",
    "requests>=2.28.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false
